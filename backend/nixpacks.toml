# Nixpacks build plan tuned for uv-managed Python projects.
# Forces Python 3.12 (matches .python-version) and uses uv to install.

[phases.setup]
nixPkgs = ["python312", "uv"]

[phases.install]
cmds = ["uv sync --frozen --no-dev"]

[start]
cmd = "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
