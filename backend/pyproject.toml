[project]
name = "academic-ally-backend"
version = "0.1.0"
description = "Local FastAPI backend for the Academic Ally AI agent crews."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "crewai[litellm,google-genai]==1.14.3",
    "tavily-python==0.5.1",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.2.2",
    "firebase-admin==6.9.0",
]

[tool.uv]
package = false
